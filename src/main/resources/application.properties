spring.application.name=WebsiteCungCapDichVuGiupViec

server.port=8083

# ============================================================
# MySQL DataSource
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/GiupViecDB?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=my-secret-pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

    # ============================================================
    # JPA / Hibernate
    # ============================================================
    spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
    spring.jpa.hibernate.ddl-auto=validate
    spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
    # Giữ session mở trong view rendering (tránh LazyInitializationException)
    spring.jpa.open-in-view=true

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================================================
# Logging
# ============================================================
logging.level.com.example=INFO
logging.level.org.springframework.web=WARN

# ============================================================
# MinIO - Object Storage (lưu ảnh danh mục, hồ sơ CTV, bằng chứng khiếu nại...)
#   Cổng 9000 = API (ứng dụng kết nối vào đây)
#   Cổng 9001 = Console quản trị trên trình duyệt (http://localhost:9001)
#   Nếu bạn chạy MinIO với cổng API khác, sửa lại minio.endpoint cho khớp.
# ============================================================
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=giup-viec-storage
# Dung lượng tối đa mỗi file tải lên MinIO (MB)
minio.max-file-size-mb=20
# Thời hạn presigned URL cấp cho ứng dụng di động (phút)
minio.presigned-expiry-minutes=60
# Giới hạn của Spring cho request upload (phải >= minio.max-file-size-mb)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ============================================================
# Redis - Caching dữ liệu
#   Key trong Redis: neatify:<tên cache>::<khóa>   (redis-cli: KEYS neatify:*)
#   Redis tắt: ứng dụng vẫn chạy, đọc thẳng từ MySQL và ghi cảnh báo ra log.
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=1000ms
spring.data.redis.connect-timeout=1000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# Thời gian sống của từng vùng cache (phút) - xem Config/RedisConfig.java
app.cache.key-prefix=neatify:
app.cache.ttl.mac-dinh=10
# Danh mục, dịch vụ, bảng giá: ít thay đổi, tự xóa cache khi HCNS cập nhật
app.cache.ttl.danh-muc-dich-vu=60
app.cache.ttl.khu-vuc=360
app.cache.ttl.khuyen-mai=10
app.cache.ttl.danh-gia=10
app.cache.ttl.thong-ke=5
# Khi Redis lỗi: bỏ qua cache trong N giây rồi mới thử kết nối lại
app.cache.tam-ngung-khi-loi=30
# Vị trí GPS của CTV trên Redis (app gửi mỗi 5 giây): hết hạn sau N giây không cập nhật
app.vi-tri-ctv.ttl-giay=120
# Bật dòng dưới để xem log cache hit/miss khi demo
# logging.level.org.springframework.cache=TRACE

# ============================================================
# Website công khai
# ============================================================
# Link tải ứng dụng di động (Google Play hoặc file APK). Để trống nếu chưa phát hành.
app.download-url=

# ============================================================
# Xếp lịch và phân công cộng tác viên (Service/PhanCongService.java)
# ============================================================
# Khoảng cách tối thiểu giữa hai việc liên tiếp của một CTV (phút) - để nghỉ và di chuyển
app.phan-cong.khoang-cach-phut=60
# Giới hạn để CTV không bị quá tải
app.phan-cong.toi-da-don-moi-ngay=4
app.phan-cong.toi-da-gio-moi-ngay=4
app.phan-cong.toi-da-don-moi-tuan=20

# ============================================================
# SMS Provider – Gửi OTP và thông báo qua tin nhắn
# ============================================================
# Giá trị hợp lệ: mock (chỉ ghi log, OTP hiện trên app) | esms (eSMS.vn thật)
# Mặc định mock để ai clone repo cũng chạy được; máy có khoá eSMS bật esms trong secrets.properties.
app.sms.provider=mock

# eSMS.vn – KHOÁ BÍ MẬT KHÔNG ĐỂ Ở ĐÂY. Đặt trong src/main/resources/secrets.properties
# (file này bị .gitignore, xem mẫu secrets.properties.example):
#   app.sms.provider=esms
#   app.esms.api-key=...
#   app.esms.secret-key=...
app.esms.api-key=
app.esms.secret-key=
# Brandname + nội dung phải đã đăng ký với eSMS. "Baotrixemay" là brandname thử nghiệm eSMS cấp sẵn.
# Khi brandname Neatify được duyệt: đổi brand-name và otp-template theo mẫu được duyệt.
app.esms.brand-name=Neatify
# Loại tin: 2 = Brandname CSKH/OTP (loại eSMS đang chấp nhận cho OTP)
app.esms.sms-type=2
# Mẫu tin OTP, %s là mã OTP. Phải khớp từng ký tự với mẫu đã đăng ký, sai sẽ bị lỗi 146.
app.esms.otp-template=%s la ma xac minh dang ky Neatify cua ban
#app.esms.brand-name=Neatify
#app.esms.otp-template=Neatify: Ma xac thuc OTP cua ban la %s. Ma co hieu luc trong 5 phut. Khong cung cap cho bat ky ai.

# ============================================================
# Khoá bí mật (eSMS...) nằm trong secrets.properties - KHÔNG commit.
# optional: không có file vẫn chạy bình thường (SMS ở chế độ mock).
# ============================================================
spring.config.import=optional:classpath:secrets.properties
