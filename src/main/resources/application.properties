spring.application.name=WebsiteCungCapDichVuGiupViec

server.port=8083

# Embedded H2 database for local running without MySQL installed
spring.datasource.url=jdbc:h2:mem:website_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.thymeleaf.check-template-location=false