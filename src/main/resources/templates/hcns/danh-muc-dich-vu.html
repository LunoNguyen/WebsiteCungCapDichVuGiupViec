<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead('Danh mục Dịch vụ – HCNS')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{layout/admin-layout :: adminSidebar('hcns', 'danh-muc-dich-vu')}"></aside>

  <div class="main-area">
    <header th:replace="~{layout/admin-layout :: adminTopbar('HCNS - Kế toán', '/hcns/dashboard', 'Danh mục Dịch vụ')}"></header>

      <main class="page-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1 class="page-title">Danh mục Dịch vụ</h1>
            <p class="page-subtitle">Quản lý các nhóm và loại dịch vụ cung cấp</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary btn-sm" data-modal-open="addCategoryModal"><i class="ti ti-plus"></i> Thêm danh mục</button>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:1.25rem;margin-bottom:2rem">
          <div th:each="ldv : ${loaiDichVus}" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;transition:var(--transition-base)">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
              <div style="font-size:1.75rem;color:var(--primary)"><i class="ti ti-category"></i></div>
              <span class="badge badge-success" th:if="${ldv.trangThai == 'HienThi'}">Hoạt động</span>
              <span class="badge badge-secondary" th:unless="${ldv.trangThai == 'HienThi'}">Ẩn</span>
            </div>
            <div style="font-weight:700;font-size:1.1rem;margin-bottom:0.25rem" th:text="${ldv.tenLoaiDichVu}">Tên danh mục</div>
            <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem;min-height:2.5rem" th:text="${ldv.moTa != null ? ldv.moTa : 'Dịch vụ tiện ích gia đình chất lượng cao'}">Mô tả</div>
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding-top:0.75rem;border-top:1px solid var(--border-light)">
              <span style="color:var(--text-muted)">Mã danh mục: <strong th:text="${ldv.maLoaiDichVu}">LDV01</strong></span>
              <span style="color:var(--accent);font-weight:600">Thứ tự: <strong th:text="${ldv.thuTuHienThi}">1</strong></span>
            </div>
            <div style="display:flex;gap:0.5rem;margin-top:1rem">
              <button class="btn btn-outline btn-sm" data-panel-open="catDetailPanel">Chi tiết</button>
              <button class="btn btn-secondary btn-sm">Chỉnh sửa</button>
            </div>
          </div>
        </div>
      </main>
  </div>
</div>

<div class="overlay" id="panelOverlay"></div>
<div class="detail-panel" id="catDetailPanel">
  <div class="detail-panel-header">
    <div><h2 style="font-size:1.1rem;font-weight:700">Chi tiet Danh muc</h2></div>
    <button class="modal-close" data-panel-close="catDetailPanel">x</button>
  </div>
  <div class="detail-panel-body">
    <div style="text-align:center;padding:1.5rem 0;border-bottom:1px solid var(--border-light);margin-bottom:1.25rem">
      <div style="font-size:3rem;color:var(--primary)"><i class="ti ti-category"></i></div>
      <div style="font-size:1.25rem;font-weight:700">Chi tiết Danh mục</div>
      <span class="badge badge-success" style="margin-top:0.5rem">Đang áp dụng</span>
    </div>
    <div class="info-row"><span class="info-label">Trạng thái</span><span class="info-value" style="color:var(--accent)">Hoạt động</span></div>
    <div class="info-row"><span class="info-label">Quy mô</span><span class="info-value">Toàn hệ thống</span></div>
    <div class="info-row"><span class="info-label">Hình thức cung cấp</span><span class="info-value">Theo giờ / Theo gói</span></div>
    <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border-light)">
      <div style="font-weight:700;font-size:0.875rem;margin-bottom:0.625rem">Mô tả dịch vụ</div>
      <textarea class="form-control" rows="4">Dịch vụ tiện ích chuyên nghiệp của Neatify đáp ứng nhu cầu gia đình tiêu chuẩn cao với cộng tác viên được xác minh lý lịch rõ ràng.</textarea>
    </div>
  </div>
  <div class="detail-panel-footer">
    <button class="btn btn-secondary" data-panel-close="catDetailPanel">Đóng</button>
  </div>
</div>

<div class="modal-overlay" id="addCategoryModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Them Danh muc Dich vu</h2>
      <button class="modal-close" data-modal-close="addCategoryModal">x</button>
    </div>
    <div class="form-group" style="margin-bottom:1rem"><label class="form-label">Ten danh muc *</label><input class="form-control" placeholder="VD: Ve sinh xe o to" required></div>
    <div class="form-group" style="margin-bottom:1rem"><label class="form-label">Bieu tuong (emoji)</label><input class="form-control" placeholder="VD: &#128663;"></div>
    <div class="form-group" style="margin-bottom:1rem"><label class="form-label">Mo ta</label><textarea class="form-control" rows="3" placeholder="Mo ta ngan gon ve dich vu..."></textarea></div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Trang thai</label>
      <select class="form-control">
        <option>Hoat dong</option>
        <option>An tam</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-modal-close="addCategoryModal">Huy</button>
      <button class="btn btn-primary" onclick="document.getElementById('addCategoryModal').classList.remove('active');Toast.show('Da them danh muc thanh cong!')">Them moi</button>
    </div>
  </div>
</div>

<div th:replace="~{layout/admin-layout :: adminScripts}"></div>
</body>
</html>
