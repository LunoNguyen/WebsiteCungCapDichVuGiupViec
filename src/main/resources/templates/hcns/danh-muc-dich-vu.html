<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead('Danh mục Dịch vụ – HCNS')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{layout/admin-layout :: adminSidebar('hcns', 'danh-muc-dich-vu')}"></aside>

  <div class="main-area">
    <header th:replace="~{layout/admin-layout :: adminTopbar('HCNS - Kế toán', '/hcns/dashboard', 'Danh mục Dịch vụ')}"></header>

    <main class="page-content">
      <div class="page-header">
        
        <div class="page-actions">
          <button class="btn btn-primary btn-sm" data-modal-open="addCategoryModal"><i class="ti ti-plus"></i> Thêm danh mục</button>
        </div>
      </div>

      <!-- Thông báo hệ thống -->
      <div th:if="${errorMessage}" style="padding:1rem;background:var(--error-bg);border:1px solid var(--danger);color:var(--danger);border-radius:var(--radius-md);margin-bottom:1rem;font-weight:600" th:text="${errorMessage}"></div>
      <div th:if="${successMessage}" style="padding:1rem;background:var(--success-bg);border:1px solid var(--success);color:var(--success);border-radius:var(--radius-md);margin-bottom:1rem;font-weight:600" th:text="${successMessage}"></div>

      <!-- Grid danh mục dịch vụ -->
      <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:1.25rem;margin-bottom:2rem">
        <div th:each="ldv : ${loaiDichVus}" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;transition:var(--transition-base);display:flex;flex-direction:column;justify-content:space-between">
          <div>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
              <!-- Ảnh danh mục lấy từ MinIO qua /files/<object key>; chưa có ảnh thì hiện biểu tượng -->
              <img th:if="${anhDanhMuc[ldv.id] != null}" th:src="${anhDanhMuc[ldv.id]}" th:alt="${ldv.tenLoaiDichVu}"
                   style="width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--border)" loading="lazy">
              <div th:if="${anhDanhMuc[ldv.id] == null}" style="font-size:1.75rem;color:var(--primary)"><i class="ti ti-category"></i></div>
              <span class="badge badge-success" th:if="${ldv.trangThai == 'HienThi'}"><span class="dot dot-green" style="width:6px;height:6px"></span>Hiển thị</span>
              <span class="badge badge-secondary" th:unless="${ldv.trangThai == 'HienThi'}">Đang ẩn</span>
            </div>
            <div style="font-weight:700;font-size:1.1rem;margin-bottom:0.25rem" th:text="${ldv.tenLoaiDichVu}">Tên danh mục</div>
            <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem;min-height:2.5rem" th:text="${ldv.moTa != null ? ldv.moTa : 'Dịch vụ tiện ích gia đình chất lượng cao'}">Mô tả</div>
          </div>

          <div>
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:0.75rem 0;border-top:1px solid var(--border-light)">
              <span style="color:var(--text-muted)">Mã: <strong th:text="${ldv.maLoaiDichVu}">LDV01</strong></span>
              <span style="color:var(--accent);font-weight:600">Thứ tự: <strong th:text="${ldv.thuTuHienThi}">1</strong></span>
            </div>
            <div style="display:flex;gap:0.4rem;margin-top:0.75rem;align-items:center">
              <button class="btn btn-secondary btn-sm" style="flex:1"
                      th:data-id="${ldv.id}"
                      th:data-ten="${ldv.tenLoaiDichVu}"
                      th:data-mota="${ldv.moTa}"
                      th:data-thutu="${ldv.thuTuHienThi}"
                      th:data-trangthai="${ldv.trangThai}"
                      th:data-hinhanh="${anhDanhMuc[ldv.id]}"
                      onclick="openEditCategoryModal(this)">
                <i class="ti ti-edit"></i> Sửa
              </button>
              <form th:if="${ldv.trangThai == 'HienThi'}" th:action="@{/hcns/danh-muc-dich-vu/sua}" method="post" style="display:inline">
                <input type="hidden" name="id" th:value="${ldv.id}">
                <input type="hidden" name="tenLoaiDichVu" th:value="${ldv.tenLoaiDichVu}">
                <input type="hidden" name="moTa" th:value="${ldv.moTa}">
                <input type="hidden" name="thuTuHienThi" th:value="${ldv.thuTuHienThi}">
                <input type="hidden" name="trangThai" value="An">
                <button type="submit" class="btn btn-outline btn-sm" title="Ẩn tạm danh mục"><i class="ti ti-eye-off"></i></button>
              </form>
              <form th:if="${ldv.trangThai != 'HienThi'}" th:action="@{/hcns/danh-muc-dich-vu/sua}" method="post" style="display:inline">
                <input type="hidden" name="id" th:value="${ldv.id}">
                <input type="hidden" name="tenLoaiDichVu" th:value="${ldv.tenLoaiDichVu}">
                <input type="hidden" name="moTa" th:value="${ldv.moTa}">
                <input type="hidden" name="thuTuHienThi" th:value="${ldv.thuTuHienThi}">
                <input type="hidden" name="trangThai" value="HienThi">
                <button type="submit" class="btn btn-success btn-sm" title="Hiển thị lại"><i class="ti ti-eye"></i></button>
              </form>
              <form th:action="@{/hcns/danh-muc-dich-vu/xoa}" method="post" style="display:inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa vĩnh viễn danh mục này khỏi hệ thống?');">
                <input type="hidden" name="id" th:value="${ldv.id}">
                <button type="submit" class="btn btn-outline btn-sm" style="color:var(--danger,var(--danger));border-color:color-mix(in srgb, var(--error-text) 25%, transparent)" title="Xóa danh mục"><i class="ti ti-trash"></i></button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ============================================================
     MODAL: THÊM DANH MỤC DỊCH VỤ (CREATE)
     ============================================================ -->
<div class="modal-overlay" id="addCategoryModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h2 class="modal-title"><i class="ti ti-folder-plus"></i> Thêm Danh mục Dịch vụ</h2>
      <button class="modal-close" data-modal-close="addCategoryModal" aria-label="Đóng" type="button"><i class="ti ti-x"></i></button>
    </div>
    <form th:action="@{/hcns/danh-muc-dich-vu/them}" method="post" enctype="multipart/form-data">
      <div style="padding:1.5rem">
        <div class="form-group" style="margin-bottom:1rem">
          <label class="form-label">Tên danh mục *</label>
          <input class="form-control" name="tenLoaiDichVu" placeholder="VD: Dọn Dẹp, Vệ Sinh Nhà Cửa" required>
        </div>
        <div class="form-row" style="margin-bottom:1rem">
          <div class="form-group">
            <label class="form-label">Thứ tự hiển thị</label>
            <input class="form-control" type="number" name="thuTuHienThi" value="1" min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Trạng thái</label>
            <select class="form-control" name="trangThai">
              <option value="HienThi">Hiển thị</option>
              <option value="An">Ẩn tạm</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Mô tả ngắn</label>
          <textarea class="form-control" name="moTa" rows="3" placeholder="Mô tả tóm tắt về loại dịch vụ này..."></textarea>
        </div>
        <div class="form-group" style="margin-top:1rem;margin-bottom:0">
          <label class="form-label">Ảnh danh mục (lưu trên MinIO)</label>
          <input class="form-control" type="file" name="hinhAnhFile" accept="image/jpeg,image/png,image/webp,image/gif">
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.35rem">jpg, png, webp hoặc gif, tối đa 20 MB. Ảnh hiển thị trên website công khai.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close="addCategoryModal">Hủy</button>
        <button type="submit" class="btn btn-primary"><i class="ti ti-check"></i> Lưu danh mục</button>
      </div>
    </form>
  </div>
</div>

<!-- ============================================================
     MODAL: CHỈNH SỬA DANH MỤC DỊCH VỤ (UPDATE)
     ============================================================ -->
<div class="modal-overlay" id="editCategoryModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h2 class="modal-title"><i class="ti ti-edit"></i> Chỉnh sửa Danh mục</h2>
      <button class="modal-close" data-modal-close="editCategoryModal" aria-label="Đóng" type="button"><i class="ti ti-x"></i></button>
    </div>
    <form th:action="@{/hcns/danh-muc-dich-vu/sua}" method="post" enctype="multipart/form-data">
      <input type="hidden" name="id" id="editCatId">
      <div style="padding:1.5rem">
        <div class="form-group" style="margin-bottom:1rem">
          <label class="form-label">Tên danh mục *</label>
          <input class="form-control" name="tenLoaiDichVu" id="editCatTen" required>
        </div>
        <div class="form-row" style="margin-bottom:1rem">
          <div class="form-group">
            <label class="form-label">Thứ tự hiển thị</label>
            <input class="form-control" type="number" name="thuTuHienThi" id="editCatThuTu" min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Trạng thái</label>
            <select class="form-control" name="trangThai" id="editCatTrangThai">
              <option value="HienThi">Hiển thị</option>
              <option value="An">Ẩn tạm</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Mô tả chi tiết</label>
          <textarea class="form-control" name="moTa" id="editCatMoTa" rows="3"></textarea>
        </div>
        <div class="form-group" style="margin-top:1rem;margin-bottom:0">
          <label class="form-label">Ảnh danh mục (lưu trên MinIO)</label>
          <img id="editCatAnh" alt="Ảnh hiện tại" style="display:none;width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--border);margin-bottom:0.5rem">
          <input class="form-control" type="file" name="hinhAnhFile" accept="image/jpeg,image/png,image/webp,image/gif">
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.35rem">Để trống nếu giữ ảnh hiện tại. Chọn ảnh mới sẽ thay ảnh cũ.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close="editCategoryModal">Hủy</button>
        <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy"></i> Cập nhật</button>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{layout/admin-layout :: adminScripts}"></div>

<script>
  function openEditCategoryModal(btn) {
    document.getElementById('editCatId').value = btn.dataset.id;
    document.getElementById('editCatTen').value = btn.dataset.ten || '';
    document.getElementById('editCatMoTa').value = btn.dataset.mota || '';
    document.getElementById('editCatThuTu').value = btn.dataset.thutu || '1';
    if (btn.dataset.trangthai) {
      document.getElementById('editCatTrangThai').value = btn.dataset.trangthai;
    }
    var anh = document.getElementById('editCatAnh');
    if (btn.dataset.hinhanh) {
      anh.src = btn.dataset.hinhanh;
      anh.style.display = 'block';
    } else {
      anh.removeAttribute('src');
      anh.style.display = 'none';
    }
    ModalManager.open('editCategoryModal');
  }
</script>
</body>
</html>
