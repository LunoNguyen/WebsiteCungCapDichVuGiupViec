<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================
     CSKH HEAD FRAGMENT
     ============================================================ -->
<head th:fragment="cskhHead(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/Logo.png">
  <title th:text="${pageTitle != null ? pageTitle + ' – CSKH | Neatify' : 'CSKH – Chăm sóc Khách hàng | Neatify'}">CSKH – Neatify</title>

  <!-- Anti-flicker Theme Script -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('neatify_theme') || 'light';
        var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-mode', saved);
      } catch(e) {}
    })();
  </script>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">

  <!-- Core CSS -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">

  <!-- FullCalendar CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script>if (window.Chart) Chart.defaults.locale = 'vi-VN';</script>

  <!-- CSKH Extra Styles -->
  <style>
    :root {
      --cskh-primary: var(--primary);
      --cskh-primary-dark: var(--primary);
      --cskh-primary-light: var(--primary);
      --cskh-accent: var(--success);
      --cskh-warning: var(--warning);
      --cskh-danger: var(--danger);
      --cskh-info: var(--primary);
      --cskh-gradient: var(--primary-soft);
    }
    .badge-cskh { background: var(--primary-soft); color: var(--primary); }
    .modal-xl { max-width: 780px !important; }
    .form-section-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); margin-bottom: 0.875rem;
      border-bottom: 1px solid var(--border-light); padding-bottom: 0.375rem;
    }
    .danger-zone {
      border: 1px solid var(--error-border);
      background: var(--error-bg);
      border-radius: var(--radius-md); padding: 1rem;
    }
    .bulk-toolbar {
      display: none; align-items: center; gap: 0.75rem;
      padding: 0.625rem 1rem;
      background: var(--fill-selected);
      border: 0;
      border-radius: var(--radius-md); font-size: 0.85rem;
      animation: slideDown 0.2s ease;
    }
    .bulk-toolbar.active { display: flex; }
    @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    /* Calendar: kẻ ô rõ, chữ đậm đủ đọc, lịch hẹn nền nhạt + chữ đậm cùng sắc */
    .calendar-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 1.25rem;
    }
    .fc { --fc-border-color: var(--line-strong); --fc-page-bg-color: var(--surface); --fc-neutral-bg-color: var(--background);
          --fc-today-bg-color: var(--primary-soft); --fc-now-indicator-color: var(--danger); --fc-event-border-color: transparent;
          font-family: var(--font-base); color: var(--foreground); }
    .fc .fc-toolbar { gap: 0.75rem; flex-wrap: wrap; }
    .fc .fc-toolbar.fc-header-toolbar { margin-bottom: 1rem; }
    .fc .fc-toolbar-title { font-size: 1.0625rem !important; font-weight: 600 !important; color: var(--foreground) !important; text-transform: capitalize; }
    .fc .fc-button {
      background: var(--surface) !important; border: 1px solid var(--line-strong) !important; box-shadow: none !important;
      color: var(--foreground) !important; font-size: 0.8125rem !important; font-weight: 500 !important;
      height: 34px; padding: 0 0.75rem !important; border-radius: var(--radius-sm) !important;
      font-family: var(--font-base) !important; transition: background-color .15s ease !important; text-transform: none;
    }
    .fc .fc-button:hover { background: var(--button-hover) !important; }
    .fc .fc-button:disabled { opacity: 1; color: var(--muted) !important; background: var(--surface) !important; }
    .fc .fc-button-primary:not(:disabled).fc-button-active,
    .fc .fc-button-primary:not(:disabled):active { background: var(--fill-selected) !important; border-color: var(--line-strong) !important; color: var(--foreground) !important; }
    .fc .fc-button .fc-icon { font-size: 1.1em; }
    .fc .fc-col-header-cell { background: var(--background); }
    .fc .fc-col-header-cell-cushion { padding: 0.5rem 0.25rem !important; color: var(--foreground-soft) !important; font-size: 0.75rem !important; font-weight: 600 !important; text-transform: capitalize; }
    .fc .fc-daygrid-day-number { padding: 0.375rem 0.5rem !important; color: var(--foreground) !important; font-size: 0.8125rem !important; font-weight: 500; }
    .fc .fc-day-other .fc-daygrid-day-number { color: var(--muted) !important; font-weight: 400; }
    .fc .fc-day-other .fc-daygrid-day-top { opacity: 1; }
    .fc .fc-day-other { background: color-mix(in srgb, var(--background) 55%, transparent); }
    .fc .fc-daygrid-day.fc-day-today { background: var(--primary-soft) !important; }
    .fc .fc-day-today .fc-daygrid-day-number {
      display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; margin: 4px; padding: 0 6px !important;
      border-radius: 9999px; background: var(--primary); color: var(--primary-foreground) !important; font-weight: 600;
    }
    .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid { border-color: var(--line-strong) !important; }
    .fc .fc-daygrid-event, .fc .fc-timegrid-event {
      border: 0 !important; border-left: 3px solid var(--ev-bar, var(--primary)) !important; border-radius: 6px !important;
      background: var(--ev-bg, var(--primary-soft)) !important; color: var(--ev-text, var(--foreground)) !important;
      font-size: 0.75rem !important; padding: 2px 6px !important; margin: 1px 4px !important; box-shadow: none !important;
    }
    .fc .fc-event-main, .fc .fc-event-title, .fc .fc-event-time { color: inherit !important; }
    .fc .fc-event-time { font-weight: 600; margin-right: 4px; }
    .fc .fc-event-title { font-weight: 500; }
    /* Ô tháng hẹp: giờ một dòng riêng, tên CTV xuống dòng, không cắt */
    .fc .fc-daygrid-event { white-space: normal; }
    .fc .fc-daygrid-dot-event { flex-wrap: wrap; align-items: baseline; }
    .fc .fc-daygrid-dot-event .fc-event-title { flex: 1 0 100%; }
    .fc .fc-daygrid-block-event .fc-event-main-frame { display: block; }
    .fc .fc-daygrid-event .fc-event-time { margin-right: 0; overflow: visible; }
    .fc .fc-daygrid-event .fc-event-title { overflow: visible; white-space: normal; text-overflow: clip; line-height: 1.35; overflow-wrap: anywhere; }
    @media (max-width: 640px) {
      /* Ô ngày chỉ ~42px: hiện giờ, bấm vào xem tên CTV và khách */
      .fc .fc-dayGridMonth-view .fc-daygrid-event .fc-event-title { display: none; }
      .fc .fc-dayGridMonth-view .fc-daygrid-event { padding: 2px 3px !important; margin: 1px 2px !important; border-left-width: 2px !important; font-size: 0.6875rem !important; }
    }
    .fc .fc-daygrid-event:hover, .fc .fc-timegrid-event:hover { filter: brightness(0.97); cursor: pointer; }
    .fc .fc-event.is-cancelled { --ev-bg: var(--neutral-bg); --ev-bar: var(--line-strong); --ev-text: var(--muted); }
    .fc .fc-event.is-cancelled .fc-event-title { text-decoration: line-through; }
    .fc .fc-daygrid-more-link { color: var(--primary); font-weight: 500; font-size: 0.75rem; }
    .fc .fc-timegrid-slot-label-cushion, .fc .fc-timegrid-axis-cushion { color: var(--muted); font-size: 0.75rem; }
    .fc .fc-list-day-cushion { background: var(--background) !important; }
    .fc .fc-list-event:hover td { background: var(--surface-hover) !important; }
    .fc .fc-list-event-dot { border-color: var(--ev-bar, var(--primary)) !important; }
    @media (max-width: 1279px) and (min-width: 641px) {
      /* Khung lịch hẹp: tiêu đề tháng một hàng riêng, nút điều hướng và nút chế độ xem hàng dưới */
      .fc .fc-toolbar.fc-header-toolbar { flex-wrap: wrap; }
      .fc .fc-toolbar-chunk:nth-child(2) { order: -1; flex: 1 1 100%; text-align: center; }
    }
    @media (max-width: 640px) {
      .fc .fc-toolbar { flex-direction: column; align-items: stretch; }
      .fc .fc-toolbar-chunk { display: flex; justify-content: center; }
    }
    /* Split view */
    .split-view { display: grid; grid-template-columns: 280px 1fr; gap: 1.25rem; }
    @media (max-width: 900px) { .split-view { grid-template-columns: 1fr; } }
    /* CTV list sidebar */
    .ctv-list-sidebar { display: flex; flex-direction: column; gap: 0.5rem; max-height: 620px; overflow-y: auto; padding-right: 4px; }
    .ctv-list-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem; border-radius: var(--radius-md);
      border: 1px solid transparent; background: transparent;
      cursor: pointer; transition: background-color 0.15s;
    }
    .ctv-list-item:hover { background: var(--fill-hover); }
    .ctv-list-item.active { background: var(--fill-selected); border-color: transparent; }
    .ctv-list-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary-soft); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.875rem; flex-shrink: 0;
    }
    .ctv-list-name { font-weight: 600; font-size: 0.85rem; }
    .ctv-list-sub { font-size: 0.72rem; color: var(--text-muted); }
    /* Review card */
    .review-card {
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius-lg); padding: 1.25rem; transition: box-shadow 0.2s;
    }
    
    .review-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; }
    .review-stars { color: #F59E0B; font-size: 1rem; font-weight: 700; letter-spacing: 2px; }
    .review-text { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 0.875rem; }
    .review-reply {
      background: var(--background); border-left: 0;
      border-radius: var(--radius-md); padding: 0.75rem;
      font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.75rem;
    }
    .reply-label { font-weight: 600; font-size: 0.78rem; color: var(--foreground); margin-bottom: 0.25rem; }
    .review-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .table-hoverable tbody tr { transition: background 0.15s ease; }
    .table-hoverable tbody tr:hover { background: var(--surface-hover); }
  </style>
</head>

<body>

<!-- ============================================================
     CSKH SIDEBAR FRAGMENT
     ============================================================ -->
<aside class="sidebar" id="sidebar" th:fragment="cskhSidebar(activeMenu)">
  <div class="sidebar-header">
    <a href="/cskh/dashboard" class="sidebar-logo-link">
      <img src="/images/Logo.png" class="sidebar-logo-img" alt="">
      <span class="sidebar-logo-text">Neatify</span>
    </a>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Thu gọn menu" aria-label="Thu gọn menu"><i class="ti ti-layout-sidebar-left-collapse"></i></button>
  </div>

  <nav class="sidebar-nav" aria-label="Điều hướng chính">
    <div class="sidebar-nav-group">
      <div class="sidebar-nav-items">
          <a href="/cskh/dashboard" class="sidebar-item" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}" th:attr="aria-current=${activeMenu == 'dashboard' ? 'page' : null}"><i class="ti ti-layout-dashboard item-icon"></i><span class="item-label">Tổng quan</span></a>
      </div>
    </div>
    <div class="sidebar-nav-group">
      <div class="sidebar-nav-group-label">Khách hàng</div>
      <div class="sidebar-nav-items">
          <a href="/cskh/khach-hang" class="sidebar-item" th:classappend="${activeMenu == 'khach-hang' ? 'active' : ''}" th:attr="aria-current=${activeMenu == 'khach-hang' ? 'page' : null}"><i class="ti ti-users item-icon"></i><span class="item-label">Khách hàng</span></a>
          <a href="/cskh/don-dat-dich-vu" class="sidebar-item" th:classappend="${activeMenu == 'don-dat-dich-vu' ? 'active' : ''}" th:attr="aria-current=${activeMenu == 'don-dat-dich-vu' ? 'page' : null}"><i class="ti ti-clipboard-list item-icon"></i><span class="item-label">Đơn đặt dịch vụ</span></a>
          <a href="/cskh/khieu-nai" class="sidebar-item" th:classappend="${activeMenu == 'khieu-nai' ? 'active' : ''}" th:attr="aria-current=${activeMenu == 'khieu-nai' ? 'page' : null}"><i class="ti ti-alert-triangle item-icon"></i><span class="item-label">Khiếu nại</span></a>
          <a href="/cskh/danh-gia" class="sidebar-item" th:classappend="${activeMenu == 'danh-gia' ? 'active' : ''}" th:attr="aria-current=${activeMenu == 'danh-gia' ? 'page' : null}"><i class="ti ti-star item-icon"></i><span class="item-label">Đánh giá dịch vụ</span></a>
      </div>
    </div>
    <div class="sidebar-nav-group">
      <div class="sidebar-nav-group-label">Vận hành</div>
      <div class="sidebar-nav-items">
          <a href="/cskh/lich-phan-cong" class="sidebar-item" th:classappend="${activeMenu == 'lich-phan-cong' ? 'active' : ''}" th:attr="aria-current=${activeMenu == 'lich-phan-cong' ? 'page' : null}"><i class="ti ti-calendar-event item-icon"></i><span class="item-label">Lịch làm việc CTV</span></a>
          <a href="/cskh/thong-bao" class="sidebar-item" th:classappend="${activeMenu == 'thong-bao' ? 'active' : ''}" th:attr="aria-current=${activeMenu == 'thong-bao' ? 'page' : null}"><i class="ti ti-bell item-icon"></i><span class="item-label">Thông báo</span></a>
      </div>
    </div>
  </nav>
</aside>


<!-- ============================================================
     CSKH TOPBAR FRAGMENT
     ============================================================ -->
<header class="topbar" th:fragment="cskhTopbar(pageTitle)">
  <button type="button" class="icon-btn topbar-menu-btn" id="mobileSidebarToggle" aria-label="Mở menu"><i class="ti ti-menu-2"></i></button>
  <h1 class="topbar-title" th:text="${pageTitle}">Trang hiện tại</h1>

  <div class="topbar-actions">
    <div class="dropdown">
      <button type="button" class="theme-toggle-btn" data-dropdown="themeMenu" id="themeToggleBtn" title="Giao diện sáng / tối" aria-label="Giao diện sáng / tối"><i class="ti ti-sun-moon" id="themeIcon"></i></button>
      <div class="dropdown-menu theme-dropdown-menu" id="themeMenu">
        <button type="button" class="theme-menu-item" data-theme-set="light"><i class="ti ti-sun theme-item-icon"></i><span>Sáng</span><i class="ti ti-check item-check"></i></button>
        <button type="button" class="theme-menu-item" data-theme-set="dark"><i class="ti ti-moon theme-item-icon"></i><span>Tối</span><i class="ti ti-check item-check"></i></button>
        <button type="button" class="theme-menu-item" data-theme-set="system"><i class="ti ti-device-desktop theme-item-icon"></i><span>Theo hệ thống</span><i class="ti ti-check item-check"></i></button>
      </div>
    </div>
    <div class="dropdown">
      <button type="button" class="topbar-icon-btn" data-dropdown="topbarNotif" title="Thông báo" aria-label="Thông báo"><i class="ti ti-bell"></i><span class="notif-dot"></span></button>
      <div class="dropdown-menu notif-dropdown" id="topbarNotif">
        <div class="notif-header"><span class="notif-title">Thông báo</span></div>
        <div class="notif-item unread">
          <div class="notif-dot-item"></div>
          <div class="notif-content"><p>Hệ thống CSKH hoạt động ổn định.</p><span>Vừa xong</span></div>
        </div>
      </div>
    </div>
    <div class="dropdown">
      <button type="button" class="topbar-avatar-btn" data-dropdown="userMenu" aria-label="Tài khoản">
        <span class="avatar avatar-sm" th:attr="data-name=${session.authenticatedFullName}" th:text="${session.userAvatar != null ? session.userAvatar : 'CS'}">CS</span>
      </button>
      <div class="dropdown-menu account-menu" id="userMenu">
        <div class="dropdown-label">
          <div class="dropdown-label-name" th:text="${session.authenticatedFullName != null ? session.authenticatedFullName : 'Nhân viên CSKH'}">Người dùng</div>
          <div class="dropdown-label-sub" th:text="${session.userRole != null ? session.userRole : 'NV Chăm sóc khách hàng'}">Vai trò</div>
        </div>
        <div class="dropdown-divider"></div>
        <a href="/logout" class="dropdown-item danger"><i class="ti ti-logout"></i>Đăng xuất</a>
      </div>
    </div>
  </div>
</header>


<!-- ============================================================
     CSKH SCRIPTS FRAGMENT
     ============================================================ -->
<div th:fragment="cskhScripts">
  <div class="toast-container" id="toastContainer"></div>
  <div class="overlay" id="sidebarOverlay"></div>
  <script src="/js/main.js"></script>
  <!-- Cập nhật dữ liệu theo thời gian thực (SSE) -->
  <script src="/js/realtime.js"></script>
  <!-- Xem file đính kèm lưu trên MinIO: gắn data-files="..." vào nút -->
  <script src="/js/file-viewer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script>
    const CSKH = {
      toast(msg, type = 'success') {
        if (typeof Toast !== 'undefined') Toast.show(msg, type);
      },
      confirm(msg, onConfirm) {
        if (window.confirm(msg)) onConfirm();
      },
      formatVND(n) {
        return Number(n).toLocaleString('vi-VN') + 'đ';
      },
      formatDate(d) {
        if (!d) return '--';
        return new Date(d).toLocaleDateString('vi-VN');
      },
      initTableSearch(inputId, tableId) {
        const input = document.getElementById(inputId);
        const table = document.getElementById(tableId);
        if (!input || !table) return;
        input.addEventListener('input', () => {
          const q = input.value.toLowerCase();
          table.querySelectorAll('tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
          });
        });
      },
      initBulkSelect(masterCbId, rowCbClass, toolbarId) {
        const master = document.getElementById(masterCbId);
        const toolbar = document.getElementById(toolbarId);
        if (!master) return;
        const rows = () => document.querySelectorAll('.' + rowCbClass);
        master.addEventListener('change', () => {
          rows().forEach(cb => cb.checked = master.checked);
          if (toolbar) toolbar.classList.toggle('active', master.checked);
        });
        rows().forEach(cb => {
          cb.addEventListener('change', () => {
            const any = [...rows()].some(c => c.checked);
            if (toolbar) toolbar.classList.toggle('active', any);
          });
        });
      }
    };

    function cskhConfirmDelete(msg, callback) {
      if (confirm(msg || 'Bạn có chắc muốn xóa mục này?')) callback();
    }

    document.addEventListener('DOMContentLoaded', () => {
      CSKH.initBulkSelect('masterCheckbox', 'rowCheckbox', 'bulkToolbar');
      CSKH.initTableSearch('tableSearchInput', 'mainDataTable');
    });
  </script>
</div>

</body>
</html>
